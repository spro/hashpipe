# Publish the committed web assets and metadata to GitHub Pages.
name: Deploy GitHub Pages

on:
  push:
    branches: [master]

concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Copy web assets
        run: cp -R source/web/. pages/

      - name: Stamp about.json
        working-directory: pages
        run: |
          node -e '
            const fs = require("fs")
            const about = JSON.parse(fs.readFileSync("about.json", "utf8"))
            about.updated = new Date().toISOString()
            about.commit = process.env.GITHUB_SHA.slice(0, 7)
            fs.writeFileSync("about.json", JSON.stringify(about, null, 2) + "\n")
          '

      - name: Commit and push
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || {
            git commit -m "Deploy website for ${GITHUB_SHA::7}"
            git push
          }
